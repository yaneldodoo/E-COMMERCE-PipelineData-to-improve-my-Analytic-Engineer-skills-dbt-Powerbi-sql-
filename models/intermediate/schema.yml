version: 2

models:

  - name: int_sales
    description: sales (orders + items + payments + products + customers)

    columns:

      - name: order_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: ordered_at
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: etat
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: category
        tests:
          - not_null

      - name: total_item_amount
        tests:
          - not_null

      - name: payment
        tests:
          - not_null


  - name: int_delivery
    description: logistic information of the orders
    columns:

      - name: order_id
        tests:
          - not_null

      - name: customer_id
        tests:
          - not_null

      - name: ordered_at
        tests:
          - not_null

      - name: delivered_at
        tests:
          - not_null

      - name: delai_livraison
        tests:
          - not_null


  - name: int_customers_orders
    description: client + orders + payments

    columns:

      - name: customer_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: ordered_at
        tests:
          - not_null

      - name: payment
        tests:
          - not_null

      - name: city
        tests:
          - not_null

      - name: etat
        tests:
          - not_null